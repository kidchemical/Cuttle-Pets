[package]
name = "cuttle-pets"
version = "0.15.0"
description = "Cuttle Pets Desktop Pet"
authors = []
edition = "2021"

[lib]
name = "cuttle_pets_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cuttle-pets"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.10.3", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tokio = { version = "1", features = ["time"] }
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
# X11 cursor polling for click-through on Xwayland (the launcher forces
# GDK_BACKEND=x11, so X coords match the window geometry units).
x11-dl = "2.21"
gtk = "0.18"
libc = "0.2"
libloading = "0.8"

[features]
devtools = []

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSRunningApplication"] }
block2 = "0.6"
